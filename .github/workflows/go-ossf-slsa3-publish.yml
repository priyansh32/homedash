# SLSA Go releaser — linux only
name: SLSA Go releaser
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release (e.g. v1.0.0)"
        required: true
  release:
    types: [created]

permissions: read-all

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    name: Build linux-${{ matrix.arch }}
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/builder_go_slsa3.yml@v2.1.0
    with:
      go-version: 1.25.0
      config-file: .github/slsa/linux-${{ matrix.arch }}.yml
      upload-assets: true
      upload-tag-name: "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.event.release.tag_name }}"
